<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <button
      type="button"
      class="btn btn-primary"
      data-bs-toggle="modal"
      data-bs-target="#mydiv"
    >
      Open PopUpWindow
    </button>
    <div class="modal" id="mydiv">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title">This is a modal</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
             data-bs-target="#mydiv"
            ></button>
          </div>
          <div class="modal-body">
            <p>
              Lorem ipsum dolor sit amet consectetur adipisicing elit. Nostrum
              inventore necessitatibus illo, cumque nobis quidem qui, dolorum
              adipisci hic minus veniam totam modi et? Quas repellat quibusdam
              perferendis accusamus porro?
            </p>
          </div>
          <div class="modal-footer">
            <h4><i>This is a modal footer</i></h4>
            <button
              class="btn close btn-primary"
              data-bs-dismiss="modal"
             data-bs-target="#mydiv"
            >
              close
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
