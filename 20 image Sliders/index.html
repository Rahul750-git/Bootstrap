<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="container mt-5 ">
      <div class="carousel slide" data-bs-ride="carousel" id="mydiv">
        <div class="carousel-inner">
          <div class="carousel-indicators">
            <button
              class="active"
              data-bs-target="#mydiv"
              data-bs-slide-to="0"
            ></button>
            <button
              class=""
              data-bs-target="#mydiv"
              data-bs-slide-to="1"
            ></button>
            <button
              class=""
              data-bs-target="#mydiv"
              data-bs-slide-to="2"
            ></button>
            <button
              class=""
              data-bs-target="#mydiv"
              data-bs-slide-to="3"
            ></button>
          </div>
          <div class="carousel-item active">
            <img src="house1.png" alt="" class="d-block w-100 h-75" />
          </div>
          <div class="carousel-item">
            <img src="house2.png" alt="" class="d-block w-100 h-75" />
          </div>
          <div class="carousel-item">
            <img src="house3.png" alt="" class="d-block w-100 h-75" />
          </div>
          <div class="carousel-item">
            <img src="house4.png" alt="" class="d-block w-100 h-50" />
          </div>
        </div>
        <button
          class="carousel-control-prev"
          data-bs-target="#mydiv"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon"></span>
        </button>
        <button
          class="carousel-control-next"
          data-bs-target="#mydiv"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon"></span>
        </button>
      </div>
    </div>
  </body>
</html>
