<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    
   
  </head>
  <body>
    <nav class="navbar navbar-expand-lg text-light bg-primary ps-4">
      <h3>📚Library Management</h3>
    </nav>
    <div class="container m-3">
      <div class="row">
        <div class="col-4">
          <div class="card">
            <div class="card-header bg-primary text-light">Add New Book</div>
            <div class="card-body">
              <form id="myform">
                <div class="m-3">
                  <label class="form-label">Book Title</label>
                  <input type="text" class="form-control" id="book" />
                </div>
                <div class="m-3">
                  <label class="form-label">Author</label>
                  <input type="text" class="form-control" id="author" />
                </div>
                <div class="m-3">
                  <label class="form-label">Category</label>
                  <input type="text" class="form-control" id="category" />
                </div>
                <button class="btn btn-success w-100">Add Book</button>
              </form>
            </div>
          </div>
        </div>
        <div class="col-8">
          <div class="card">
            <div class="card-header bg-success text-light">Book List</div>
            <div class="card-body">
              <table
                class="table table-bordered table-striped table-responsive"
              >
                <thead class="bg-primary text-light">
                  <tr>
                    <th>#</th>
                    <th>Book Title</th>
                    <th>Author</th>
                    <th>Category</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="data"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
    <footer class="text-center bg-success text-light p-2">
      <small>Library Management System | &copy; 2026 All rights reserved</small>
    </footer>
     <script src="script.js"></script>
  </body>
</html>
